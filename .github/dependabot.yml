# Grouping is the point: this repo pins dependencies exactly, and packages
# can peer-pin each other to the same exact version. A single-package bump
# splits such pairs and fails the install, so dependabot must bump related
# packages together in one pull request.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
